<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a1a1a'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23f5f1eb'%3EJR%3C/text%3E%3C/svg%3E">

<body data-page="contact" id="top">
<main>

<div class="wrap contact-banner"><div class="frame"><img src="media/img/about.jpg" srcset="media/img/w1000/about.jpg 1000w, media/img/about.jpg 1400w" sizes="100vw" alt="Rohit photographing his reflection" fetchpriority="high"></div></div>
<section class="wrap contact-min">
  <h1 class="title">Let&rsquo;s talk</h1>
  <p class="lead">Tell me about your day. I reply personally within 24 hours.</p>
  <form class="mform" id="enquiry" novalidate>
    <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="e-name"><span class="err" id="e-name" role="alert"></span></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required aria-describedby="e-email"><span class="err" id="e-email" role="alert"></span></div>
    <div class="field"><label for="f-phone">Phone / WhatsApp</label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" aria-describedby="e-phone"><span class="err" id="e-phone" role="alert"></span></div>
    <div class="field"><label for="f-type">Event type</label><select id="f-type" name="type"><option value="">Select</option><option>Wedding</option><option>Pre-Wedding</option><option>Wedding Film</option><option>Event</option><option>Other</option></select></div>
    <div class="field"><label for="f-date">Event date</label><input id="f-date" name="date" type="date"></div>
    <div class="field full"><label for="f-msg">Message</label><textarea id="f-msg" name="message" rows="4"></textarea></div>
    <div class="full"><button class="btn" type="submit">Send</button></div>
  </form>
  <div class="form-ok" id="formOk" role="status"><h3>Thank you</h3><p>I&rsquo;ll reply within 24 hours.</p></div>
  <p class="contact-alt"><a data-site="email" data-site-href="email" href="#"></a><a data-site="instagram" data-site-href="instagram" target="_blank" rel="noopener" href="#"></a><a data-wa="Hi Rohit, I'd love to talk about our wedding." target="_blank" rel="noopener" href="#">WhatsApp</a></p>
</section>
</main>
<div id="footer"></div>
</body>
</html>
